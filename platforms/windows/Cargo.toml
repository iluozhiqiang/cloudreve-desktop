[package]
name = "cloudreve-platforms-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
bytes = "1"
cloudreve-app-config = { path = "../../crates/app-config" }
cloudreve-platforms-api = { path = "../../crates/cloudreve-platforms-api" }
cloudreve-platforms-windows-cfapi = { path = "./cfapi" }
dark-light = "2.0.0"
nt-time = "0.8.0"
rust-i18n = "3"
sha2 = "0.10"
showfile = "0.1"
tracing = "0.1"
url = "2.5"
widestring = "1.0.2"
win32_notif = { path = "./notif" }
windows-core = "0.58.0"
windows = { version = "0.58.0", features = ["implement", "Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_System_CorrelationVector", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Security", "Win32_UI_Shell_PropertiesSystem", "Storage_Provider", "Win32_System_IO", "Win32_System_Memory", "Storage", "Storage_Search", "Foundation", "Foundation_Collections", "Win32_Security_Authorization", "Win32_System_Search", "Storage_Streams", "Win32_System_Ioctl", "ApplicationModel", "ApplicationModel_Core", "Win32_Graphics_Gdi", "Graphics_Imaging", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_UI_Notifications"] }
